function hiddenRewards(){return rewardMilestones.map(x=>({...x,locked:true}))}
function rewardForMilestone(days){
 if(!state.rewardReveals)state.rewardReveals={};
 if(state.rewardReveals[days])return state.rewardReveals[days];
 let pool=rewardPool[days]||[];
 if(!pool.length)return null;
 let r=pool[Math.floor(Math.random()*pool.length)];
 state.rewardReveals[days]=r;
 return r;
}
const rewards=hiddenRewards();
const key=k=>new Date(k+'T12:00:00');
const dateKey=d=>{let x=new Date(d);let y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const today=dateKey(new Date());
let state=null;
const DB_NAME='PulseHabitsDB', DB_VERSION=1, STORE='app';
let dbReady=null;
function openPulseDB(){
 return new Promise((resolve,reject)=>{
   if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}
   const req=indexedDB.open(DB_NAME,DB_VERSION);
   req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};
   req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>db.close();resolve(db)};
   req.onerror=()=>reject(req.error);
 });
}
async function loadState(){
 try{
   const db=await openPulseDB();
   const value=await new Promise((resolve,reject)=>{
     const tx=db.transaction(STORE,'readonly'), st=tx.objectStore(STORE), r=st.get('state');
     r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
   });
   db.close();
   return value||{habits:initialHabits,checks:{},workouts:{},earned:[],freeze:1,rewards:rewards,rewardReveals:{},settings:{theme:'light'}};
 }catch(e){
   const fallback=localStorage.getItem('pulse-fallback');
   return fallback?JSON.parse(fallback):{habits:initialHabits,checks:{},workouts:{},earned:[],freeze:1,rewards:rewards,rewardReveals:{},settings:{theme:'light'}};
 }
}
async function save(){
 try{
   const db=await openPulseDB();
   await new Promise((resolve,reject)=>{
     const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,'state');
     tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
   });
   db.close();
 }catch(e){localStorage.setItem('pulse-fallback',JSON.stringify(state))}
}
function dow(k){return key(k).getDay()}
function scheduled(h,k){return h.active!==false && (h.days||[]).includes(dow(k))}
function done(id,k){return !!state.checks[k]?.includes(id)}
function toggle(id,k){state.checks[k]??=[];let a=state.checks[k],i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);save();render()}
function scheduledHabits(k=today){return state.habits.filter(h=>scheduled(h,k))}
function stats(k=today){let hs=scheduledHabits(k), n=hs.length, d=hs.filter(h=>done(h.id,k)).length;return {n,d,perfect:n>0&&n===d}}
function streak(id){
 let s=0,d=new Date(); 
 while(true){let k=dateKey(d),h=state.habits.find(x=>x.id===id); if(!h||!scheduled(h,k)||!done(id,k))break;s++;d.setDate(d.getDate()-1)}
 return s;
}
function perfectStreak(){
 let s=0,d=new Date();while(true){let k=dateKey(d);if(!stats(k).perfect)break;s++;d.setDate(d.getDate()-1)}return s;
}
function fmt(k){return key(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function verse(){return verses[Math.floor(key(today).getTime()/86400000)%verses.length]}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function checkReward(){
 let ps=perfectStreak();
 let candidate=rewardMilestones.find(r=>r.days===ps&&!state.earned.includes(ps));
 if(candidate){
   let reward=rewardForMilestone(ps);
   if(reward){
     state.earned.push(ps);
     save();
     setTimeout(()=>rewardPop(reward,candidate.days),350);
   }
 }
}
function rewardPop(r,days){
 let e=document.createElement('div');e.className='rewardpop';
 e.innerHTML=`<div class="rewardcard"><div class="rewardbig">${r.icon}</div><div class="badge">${days} PERFECT DAYS</div><h2>🎉 Mystery reward unlocked!</h2><h3 style="font-size:22px;margin:10px 0">${r.name}</h3><p>${r.text}</p><button class="primary" onclick="this.closest('.rewardpop').remove()">I earned this ✨</button></div>`;
 document.body.appendChild(e);
}
function nav(tab){location.hash=tab}
function render(){

 checkReward();
}
function tabs(active){return `<div class="tabs"><div class="tabsin">${[['today','🏠','Today'],['habits','✓','Habits'],['workout','🏋️','Workout'],['progress','📈','Progress'],['settings','⚙️','More']].map(x=>`<button class="tab ${active===x[0]?'active':''}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`}
function header(title,sub=''){return `<div class="top"><div><div class="brand">${title}</div><div class="sub">${sub}</div></div><button class="iconbtn" onclick="nav('settings')">⚙️</button></div>`}
function todayView(){

 document.getElementById('app').innerHTML=header('Pulse',fmt(today))+`<div class="screen">

function freqText(h){if((h.days||[]).length===7)return'Every day';return (h.days||[]).map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(' • ')}
function nextReward(ps){let r=rewardMilestones.find(x=>x.days>ps);return r?`${r.days} days 🎁`:'you’ve reached the end of the vault'} days`:'custom rewards'}
function habitsView(){

}

 let h=id?state.habits.find(x=>x.id===id):{id:Date.now(),name:'',icon:'✨',days:[1,2,3,4,5,6,0],active:true};
 let ds=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 let box=document.createElement('div');box.className='modal';box.innerHTML=`<div class="modalbox"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>${id?'Edit habit':'New habit'}</h2><div class="form"><input id="hn" placeholder="Habit name" value="${h.name}"><input id="hi" placeholder="Emoji" value="${h.icon}"><label><b>Days</b><div class="days">${ds.map((d,i)=>`<button type="button" class="day ${(h.days||[]).includes(i)?'on':''}" data-day="${i}">${d}</button>`).join('')}</div></label><button class="primary" id="saveh">${id?'Save changes':'Add habit'}</button>${id?'<button class="danger" id="delh">Delete habit</button>':''}</div></div>`;
 document.body.appendChild(box);box.querySelectorAll('.day').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 box.querySelector('#saveh').onclick=()=>{h.name=box.querySelector('#hn').value.trim()||'Untitled habit';h.icon=box.querySelector('#hi').value.trim()||'✨';h.days=[...box.querySelectorAll('.day.on')].map(b=>+b.dataset.day);if(!h.days.length)return toast('Choose at least one day.');if(id)Object.assign(state.habits.find(x=>x.id===id),h);else state.habits.push(h);save();box.remove();render()};
 if(id)box.querySelector('#delh').onclick=()=>{if(confirm('Delete this habit? Past records will remain in your backup, but the habit will no longer appear.')){state.habits=state.habits.filter(x=>x.id!==id);save();box.remove();render()}}
}
function workoutView(){
 let w=workouts[dow(today)], doneW=!!state.workouts[today],items=w.items.map((x,i)=>`<div class="exercise"><div class="row"><div><b>${i+1}. ${x[0]}</b><div class="meta">${x[1]}</div></div><a class="secondary" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x[0]+' exercise proper form')}">▶ Demo</a></div></div>`).join('');
 document.getElementById('app').innerHTML=header('Workout','A plan for today')+`<div class="screen"><div class="hero"><div class="pill" style="background:#ffffff22;color:#fff">🔥 WEIGHT-LOSS FOCUS</div><h1 style="margin-top:8px">${w.name}</h1><p>${w.focus}. Adjust intensity to your level and swap impact exercises for low-impact versions when needed.</p></div><div class="card">${items}</div><button class="${doneW?'secondary':'primary'}" style="width:100%" onclick="state.workouts['${today}']=!state.workouts['${today}'];save();render()">${doneW?'✓ Workout completed':'Mark workout complete'}</button><div class="sectiontitle">🔥 Weight-loss workout approach</div><div class="card muted">Pulse combines strength work with walking/cardio because sustainable progress is about building a routine you can keep doing — not punishing yourself with workouts.</div><div class="sectiontitle">This week's plan</div>${Object.entries(workouts).map(([d,x])=>`<div class="card row"><div><b>${x.name}</b><div class="meta">${x.items.length} exercises</div></div><span>${+d===dow(today)?'👉':''}</span></div>`).join('')}</div>${tabs('workout')}`;
}
function monthName(y,m){return new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function monthCalendar(y,m){
 let first=new Date(y,m,1), last=new Date(y,m+1,0), offset=first.getDay(), days=last.getDate();
 let cells=[];
 for(let i=0;i<offset;i++)cells.push('<div class="cal blank"></div>');
 for(let d=1;d<=days;d++){
   let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,s=stats(k);
   let cls=s.perfect?'perfect':s.d?'good':'';
   if(k===today)cls+=' current';
   cells.push(`<button class="cal ${cls}" onclick="showDay('${k}')">${d}</button>`);
 }
 return cells.join('');
}
function showDay(k){
 let s=stats(k), date=key(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 let hs=scheduledHabits(k);
 let body=hs.length?hs.map(h=>`<div class="card habit"><div class="habitmain"><b>${h.icon} ${h.name}</b><div class="meta">${done(h.id,k)?'✓ Completed':'Not completed'}</div></div></div>`).join(''):'<div class="empty">No habits scheduled for this day.</div>';
 let e=document.createElement('div');e.className='modal';e.innerHTML=`<div class="modalbox"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>${date}</h2><div class="hero" style="margin-top:12px"><h1>${s.perfect?'🌟 Perfect Day':s.n?'Progress':'Rest day'}</h1><p>${s.d} of ${s.n} scheduled tasks completed</p><div class="progressbar"><div style="width:${s.n?Math.round(s.d/s.n*100):0}%"></div></div></div>${body}</div>`;document.body.appendChild(e);
}
function progressView(){
 let ps=perfectStreak(), total=0,doneN=0;
 for(let i=0;i<60;i++){let d=new Date();d.setDate(d.getDate()-i);let k=dateKey(d),s=stats(k);if(s.n){total+=s.n;doneN+=s.d}}
 let now=new Date(),y=now.getFullYear(),m=now.getMonth();
 let cells=monthCalendar(y,m);
 document.getElementById('app').innerHTML=header('Progress','See the life you’re building')+`<div class="screen">
 <div class="grid"><div class="metric"><div class="muted">Perfect-day streak</div><b>🔥 ${ps}</b></div><div class="metric"><div class="muted">60-day completion</div><b>${total?Math.round(doneN/total*100):0}%</b></div></div>
 <div class="sectiontitle">📅 Monthly calendar</div>
 <div class="card">
   <div class="row" style="margin-bottom:12px"><button class="secondary" onclick="changeMonth(-1)">‹</button><b id="monthTitle">${monthName(y,m)}</b><button class="secondary" onclick="changeMonth(1)">›</button></div>
   <div class="calendar weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
   <div id="monthGrid" class="calendar">${cells}</div>
   <div class="meta" style="margin-top:12px">🟣 Perfect Day · 🟢 Some progress · ◻ No completed tasks · Tap a day for details</div>
 </div>
 <div class="sectiontitle">🔥 Your habit streaks</div>
 ${state.habits.map(h=>`<div class="card row"><div>${h.icon} <b>${h.name}</b></div><b>🔥 ${streak(h.id)}</b></div>`).join('')}
 <div class="sectiontitle">🎁 Rewards earned</div>
 ${state.earned.length?state.earned.map(d=>{let r=state.rewards.find(x=>x.days===d);return`<div class="card reward"><div class="rewardicon">${r?.icon||'🏆'}</div><div><b>${r?.name||d+' days'}</b><div class="meta">${d} Perfect Days</div></div></div>`}).join(''):'<div class="empty">Your first reward is waiting for you.</div>'}
 </div>${tabs('progress')}`;
}
let calendarYear=new Date().getFullYear(),calendarMonth=new Date().getMonth();
function changeMonth(delta){
 calendarMonth+=delta;
 if(calendarMonth<0){calendarMonth=11;calendarYear--}
 if(calendarMonth>11){calendarMonth=0;calendarYear++}
 let p=document.getElementById('monthGrid'), title=document.getElementById('monthTitle');
 if(p&&title){title.textContent=monthName(calendarYear,calendarMonth);p.innerHTML=monthCalendar(calendarYear,calendarMonth)}
}
function settingsView(){
 let unlocked=state.earned||[];
 document.getElementById('app').innerHTML=header('More','Backup, rewards & settings')+`<div class="screen">
 <div class="sectiontitle">🎁 Secret reward vault</div>
 <div class="card"><b>Your rewards are supposed to be a surprise. 🤫</b><div class="meta">Milestones are spaced out so Pulse rewards consistency without turning every week into a shopping trip.</div>
 <div class="rewardvault">${rewardMilestones.map(r=>{let got=unlocked.includes(r.days),rr=state.rewardReveals?.[r.days];return`<div class="vaultitem ${got?'unlocked':''}"><div class="rewardicon">${got?(rr?.icon||'🎁'):'🔒'}</div><div><b>${got?(rr?.name||'Reward unlocked'):r.days+' Perfect Days'}</b><div class="meta">${got?'Unlocked ✨':'Mystery reward'}</div></div></div>`}).join('')}</div></div>
 <div class="sectiontitle">💾 Your data</div><div class="card"><p class="muted">Your data is stored locally in IndexedDB. Export a backup occasionally so you can restore it after clearing site data or changing phones.</p><div class="row"><button class="primary" onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('imp').click()">Import backup</button></div><input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></div>
 <div class="sectiontitle">📱 Install</div><div class="card"><div class="muted">Use Chrome's menu → <b>Add to Home screen</b> or <b>Install app</b> when available.</div><button id="installBtn" class="primary" style="margin-top:12px;display:none">Install Pulse</button></div>
 <div class="sectiontitle">About</div><div class="card muted">Pulse is a personal habit + workout tracker. No login is required.</div>
 </div>${tabs('settings')}`;
}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pulse-backup-'+today+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.habits||!x.checks)throw 0;state=x;save();render();toast('Backup restored.')}catch(e){toast('That backup could not be read.')}};r.readAsText(file)}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-block'});
document.addEventListener('click',e=>{
 if(e.target && e.target.id==='installBtn' && deferredInstall){
   deferredInstall.prompt();
   deferredInstall.userChoice.finally(()=>{deferredInstall=null;e.target.style.display='none'});
 }
});
window.addEventListener('appinstalled',()=>{deferredInstall=null});
window.addEventListener('hashchange',render);
(async()=>{
  state=await loadState();
  render();
  if('serviceWorker' in navigator && window.isSecureContext){
    navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});
  }
})();
</script>
